limit_req_zone $binary_remote_addr zone=ticketsolve_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ticketsolve_chatbot:10m rate=120r/m;

server {
    server_name tikketsolve-systemoneit.uk www.tikketsolve-systemoneit.uk;

    server_tokens off;
    client_max_body_size 60m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 30s;

    location = /favicon.ico { access_log off; log_not_found off; }
    
    location /static/ {
        alias /var/www/ticketSolve/staticfiles/;
    }

    # Attachments must be downloaded through Django authorization views.
    location /media/ {
        return 404;
    }

    location = /login/ {
        limit_req zone=ticketsolve_login burst=5 nodelay;
        include proxy_params;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_pass http://unix:/var/www/ticketSolve/gunicorn.sock;
    }

    # Bind the isolated chatbot service to the existing Django session and
    # RBAC policy. These auth endpoints cannot be requested from the internet.
    location = /_internal/chatbot-auth/user/ {
        internal;
        include proxy_params;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_pass http://unix:/var/www/ticketSolve/gunicorn.sock;
    }

    location = /_internal/chatbot-auth/admin/ {
        internal;
        include proxy_params;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_pass http://unix:/var/www/ticketSolve/gunicorn.sock;
    }

    # Gemini Chatbot Microservice Endpoints
    location /chatbot-admin {
        auth_request /_internal/chatbot-auth/admin/;
        auth_request_set $chatbot_user $upstream_http_x_chatbot_user;
        auth_request_set $chatbot_role $upstream_http_x_chatbot_role;
        proxy_set_header X-TicketSolve-Authenticated-User $chatbot_user;
        proxy_set_header X-TicketSolve-Authenticated-Role $chatbot_role;
        proxy_pass http://127.0.0.1:8001/admin;
        include proxy_params;
    }

    location /chatbot-static/ {
        proxy_pass http://127.0.0.1:8001/static/;
        include proxy_params;
    }

    location /api/admin/ {
        auth_request /_internal/chatbot-auth/admin/;
        auth_request_set $chatbot_user $upstream_http_x_chatbot_user;
        auth_request_set $chatbot_role $upstream_http_x_chatbot_role;
        proxy_set_header X-TicketSolve-Authenticated-User $chatbot_user;
        proxy_set_header X-TicketSolve-Authenticated-Role $chatbot_role;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8001/api/admin/;
        include proxy_params;
    }

    location = /api/chat {
        auth_request /_internal/chatbot-auth/user/;
        auth_request_set $chatbot_user $upstream_http_x_chatbot_user;
        auth_request_set $chatbot_role $upstream_http_x_chatbot_role;
        proxy_set_header X-TicketSolve-Authenticated-User $chatbot_user;
        proxy_set_header X-TicketSolve-Authenticated-Role $chatbot_role;
        limit_req zone=ticketsolve_chatbot burst=30 nodelay;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8001/api/chat;
        include proxy_params;
    }

    location /api/ {
        auth_request /_internal/chatbot-auth/user/;
        auth_request_set $chatbot_user $upstream_http_x_chatbot_user;
        auth_request_set $chatbot_role $upstream_http_x_chatbot_role;
        proxy_set_header X-TicketSolve-Authenticated-User $chatbot_user;
        proxy_set_header X-TicketSolve-Authenticated-Role $chatbot_role;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8001/api/;
        include proxy_params;
    }

    location / {
        include proxy_params;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_pass http://unix:/var/www/ticketSolve/gunicorn.sock;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tikketsolve-systemoneit.uk/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tikketsolve-systemoneit.uk/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.tikketsolve-systemoneit.uk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = tikketsolve-systemoneit.uk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name tikketsolve-systemoneit.uk www.tikketsolve-systemoneit.uk;
    return 404; # managed by Certbot
}
